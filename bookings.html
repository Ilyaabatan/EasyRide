<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyRide - bookings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
</head>
<body>
    <article style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d'); background-size: cover; background-position: center;">
    <!--Consistent Navbar with mobile toggle-->
    <nav class="navbar" id="bookings">
        <div class="container" >
            <h1 class="logo">Car Rental</h1>
            <button class="menu-toggle" id="mobile-menu">
            
            </button>
            <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#cars">Cars</a></li>
            <li><a href="bookings.html">Bookings</a></li>
            </ul>
        </div>
    </nav>
    <!-- Booking Section -->
     <section id="booking-form" class="container">
        <h2>Book a Car</h2>
        <form id="booking-form">
            <label for="car">Car</label>
            <select name="car" id="car" required>
                <option value="" disabled selected>Select a car</option>
                <option value="car1">Car 1</option>
                <option value="car2">Car 2</option>
                <option value="car3">Car 3</option>
                <option value="car4">Car 4</option>
            </select>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="start-date">Start Date:</label>
            <input type="text" id="start-date" name="start-date" required>
            <label for="end-date">End Date:</label>
            <input type="text" id="end-date" name="end-date" required>
            <button type="submit" class="btn">Submit Booking</button>
        </form>
     </section>
    </article>
     <!--Booking List: Sample-->
        <section id="bookings" class="container">
            <h2>Your Bookings</h2>
            <table class="bookings-list">
                <thead>
                    <tr class="booking">
                        <th>Car</th>
                        <th>Name</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="booking">
                        <td>Car 1</td>
                        <td>John Doe</td>
                        <td>2023-10-01</td>
                        <td>2023-10-05</td>
                    </tr>
                    <!-- Add more bookings as needed -->
                </tbody>
            </table>

        </section>
    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2023 EasyRide. All rights reserved.</p>
            <ul class="socials">
                <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                <li><a href="#"><i class="fab fa-twitter"></i></a></li>
                <li><a href="#"><i class="fab fa-instagram"></i></a></li>
            </ul>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
